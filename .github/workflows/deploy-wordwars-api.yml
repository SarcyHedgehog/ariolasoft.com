name: Deploy Word Wars API to GoDaddy

on:
  push:
    branches: [main]
    paths:
      - "wordwars-api/**"
      - ".github/workflows/deploy-wordwars-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy only the Word Wars API over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.GODADDY_FTP_SERVER }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wordwars-api/
          server-dir: ${{ format('{0}wordwars-api/', secrets.GODADDY_FTP_SERVER_DIR) }}

name: Prepare catalogue suggestion for review

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-review:
    if: >-
      github.event.label.name == 'ready-for-catalogue-review' &&
      startsWith(github.event.issue.title, '[Catalogue]')
    runs-on: ubuntu-latest
    concurrency:
      group: catalogue-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Check out catalogue
        uses: actions/checkout@v6

      - name: Extract suggestion safely
        run: jq -r '.issue.body' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/catalogue-issue.txt"

      - name: Apply and validate suggestion
        run: python tools/apply-catalogue-suggestion.py "$RUNNER_TEMP/catalogue-issue.txt"

      - name: Create review branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="catalogue/issue-${ISSUE_NUMBER}"
          git config user.name "ariolasoft-catalogue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add catalogue.json titles.html titles
          git commit -m "Catalogue suggestion #${ISSUE_NUMBER}"
          git push --set-upstream origin "$branch"
          printf '%s\n' \
            "A catalogue contribution is ready for editorial review." \
            "" \
            "- Review the structured-data and generated-page changes." \
            "- Check any image link or contextual notes in issue #${ISSUE_NUMBER}." \
            "- Merge to accept, or close this pull request to reject." \
            "" \
            "Closes #${ISSUE_NUMBER}" > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Confirm that editorial review has started
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "Thank you. This suggestion has passed the initial checks and is now awaiting editorial review."

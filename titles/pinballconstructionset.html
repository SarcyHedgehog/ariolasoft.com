        <h2 id="text-header">Pinball Construction Set</h2>
        <textarea id="text-box" readonly>Pinball Construction Set was designed and programmed by Bill Budge, first published by BudgeCo for the Apple II in 1982 and released by Electronic Arts in 1983 with Atari 8-bit and Commodore 64 editions. Ariolasoft published the game in Europe.

Rather than supplying only a fixed table, it lets players construct their own pinball machines through a graphical drag-and-drop interface. Bumpers, flippers, spinners and other parts can be positioned freely, while gravity and aspects of the physics can be adjusted. Completed tables can be saved and shared, and can be played without the construction program.

The game established the construction-set genre and became one of the most influential early examples of user-generated game content.</textarea>

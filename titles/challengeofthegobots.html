Challenge of the Gobots appeared in 1987 under the Reaktor label. The catalogue credits Byte Engineers.

Known catalogue formats: Commodore 64, Amstrad CPC, ZX Spectrum.

Byte Engineers was the credited name used by Tony Crowther for this work while he was contracted to Alligata Software.

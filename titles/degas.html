        <h2 id="text-header">Degas</h2>
        <textarea id="text-box" readonly>DEGAS — the Design &amp; Entertainment Graphic Arts System — was a bitmap painting program created by Tom Hudson for the Atari ST and published by Batteries Included in 1985. Its working title had been HUDraw before Hudson adopted the name inspired by the French artist Edgar Degas.

One of the first full-featured art packages for the new Atari ST, DEGAS supported all three of the machine's display modes and supplied tools for freehand drawing, shapes, fills, text and detailed pixel editing. Its PI1, PI2 and PI3 picture formats became widely recognised across the ST software scene.

Ariolasoft published DEGAS in the UK and Europe. It was an Atari ST-exclusive application.</textarea>

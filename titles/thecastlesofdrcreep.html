        <h2 id="text-header">The Castles of Dr. Creep</h2>
        <textarea id="text-box" readonly>The Castles of Dr. Creep is a Commodore 64 puzzle-platform game written by Ed Hobbs and first published by Brøderbund in 1984. Ariolasoft published the UK edition in 1985.

Players explore a collection of large, interconnected castles and must solve each one before escaping. Rooms contain switches, ladders, moving walkways, lifts, trapdoors, force fields and teleporters, alongside hazards drawn from classic horror films: mummies, vampires, Frankenstein's monster and other residents of Dr. Creep's estate.

The game includes thirteen main castles plus a tutorial and can be played alone or cooperatively by two players. Progress depends less on quick reactions than on understanding how rooms connect and how one mechanism affects another, making it an unusually elaborate mixture of platform action and environmental puzzle solving for its period.</textarea>

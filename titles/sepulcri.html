        <h2 id="text-header">Sepulcri</h2>
        <textarea id="text-box" readonly>Sepulcri is a 1986 platform game programmed by Chris Sawyer and published by Ariolasoft. In the year 2075, engineers testing the first Strategic Defence Initiative satellite send a tiny robot inside its main computer to inspect the circuitry and report its many faults. Unfortunately, one confused technician has miniaturised male sheep and installed them in place of conventional RAM, leaving the robot to contend with some unusually literal computer hazards.

The first task is to explore the rooms and activate all 50 dip-switches by jumping on them. Moving enemies, sharp surfaces, unstable integrated circuits and floating points threaten the robot along the way. Once every switch has been found, the robot must enter ROTTES - Ridiculously Over The Top Exit Security - and alter ten code posts to spell LETMEOUTOK before locating the exit.

The original instructions credit Chris Sawyer with programming, Jill Lawson at 4am Designs with graphics and puns, the Tech Team with the implausible storyline, and IFRIT with the instructions. They also document redefinable controls, a pause function and an unusually useful screen-dump feature intended to help players map the game's rooms.</textarea>

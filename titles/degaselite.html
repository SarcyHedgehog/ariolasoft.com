        <h2 id="text-header">Degas Elite</h2>
        <textarea id="text-box" readonly>DEGAS Elite was Tom Hudson's expanded successor to DEGAS, published by Batteries Included in 1986 for the Atari ST. It retained compatibility with pictures created in the original program while considerably enlarging its creative toolset.

Elite added multiple work screens, clip-art handling and advanced block operations including scaling, rotation, skewing and distortion. Its colour-cycling animation controls let artists set the direction and speed of palette changes, producing animated effects without redrawing the image frame by frame.

Ariolasoft published DEGAS Elite in the UK and Europe. Like its predecessor, it was exclusive to the Atari ST.</textarea>

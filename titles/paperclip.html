        <h2 id="text-header">Paperclip</h2>
        <textarea id="text-box" readonly>PaperClip was the flagship word processor from Canadian software company Batteries Included. The Commodore 64 version was written by Steve Douglas; Steve Ahlstrom and Dan Moore produced the substantially different Atari 8-bit version, drawing on the editor from the Action! programming language.

PaperClip combined document editing and printing with unusually capable features for an 8-bit home computer, including macros, multiple editing windows, search and replace, block operations and mail-merge facilities. It became one of the best-known serious applications for both platforms.

Ariolasoft published PaperClip in the UK in 1985 for the Commodore 64 and Atari 8-bit family. Both Ariolasoft editions were supplied on disk; there were no cassette editions.</textarea>
